<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Style UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        /* LEFT SIDE */
        .sidebar {
            width: 30%;
            background: #111b21;
            color: white;
            border-right: 1px solid #333;
        }

        .sidebar h2 {
            padding: 15px;
            background: #202c33;
            text-align: center;
        }

        .chat {
            padding: 15px;
            cursor: pointer;
            border-bottom: 1px solid #333;
        }

        .chat:hover {
            background: #2a3942;
        }

        /* RIGHT SIDE */
        .content {
            width: 70%;
            background: #0b141a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
    </style>
</head>

<body>

<div class="app">

    <!-- LEFT PANEL -->
    <div class="sidebar">
        <h2>Chats</h2>

        <div class="chat" onclick="openChat('Ali')">Ali</div>
        <div class="chat" onclick="openChat('Ahmad')">Ahmad</div>
        <div class="chat" onclick="openChat('Sara')">Sara</div>
        <div class="chat" onclick="openChat('Family Group')">Family Group</div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="content" id="content">
        Select a chat 👈
    </div>

</div>

<script>
    function openChat(name) {
        document.getElementById("content").innerHTML =
            "💬 Chat opened with <b>" + name + "</b>";
    }
</script>

</body>
</html>
