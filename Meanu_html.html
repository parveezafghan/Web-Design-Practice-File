<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        .navbar{

            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color:#003366;
            padding: 15px 30px;
            color: white;

        }

        .logo{
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links ul{
            list-style: none;
            display: flex;

        }

        .nav-links ul li{
            padding-left:25px;

        }

        .nav-links ul li a{
            text-decoration: none;
            color: white;
            font-size: 16px;

        }

        .menu-toggle{

            display: none;
            font-size: 26px;
            cursor: pointer;
        }


        @media (max-width:768px){

            .nav-links{

                position:absolute;
                top: 60px;
                right:0;
                background-color:#003366;
                width:100%;
                display: none;
                text-align: center;
            }
            .nav-links ul{

                margin: 15px 0;

            }

            .menu-toggle{
                display:block;
            }
        }
    </style>
</head>
<body>

    <div class="navbar">

        <div class="log">
            AFGHAN Bank
        </div>


        <div class="menu-toggle" onclick="togglem()">
           ==
        </div>


        <div class="nav-links" id="nav-links">

            <ul>
                <li><a href="">Home</a></li>
                 <li><a href="">Home</a></li>
                  <li><a href="">Home</a></li>
                   <li><a href="">Home</a></li>
                    <li><a href="">Home</a></li>
            </ul>
        </div>
    </div>
    

    <script>

        function togglem(){

            var meanu=document.getElementById("nav-links");

            if(meanu.style.display=='block'){

                meanu.style.display='none';
            }
            else {

                meanu.style.display='block'
            }
        }
    </script>
</body>
</html>
