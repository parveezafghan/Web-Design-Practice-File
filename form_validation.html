       form.addEventListener('submit',(e)=>{


        e.preventDefault();

         
         validate();
       })

       function validate(){

        function error(element,message){
            
            let form_group=element.parentElement;
            form_group.className="sm error";

            form_group.querySelector('small').innerHTML=message;

        }


        function success(element){

           let form_group=element.parentElement;
           form_group.className="success";
        }

        if(name.value==""){

            error(name,'Name is Required');
        } else if(name.value.length<3){


            error(name,"At least 3 Character Name");
        }else if(name.value.match(/[0-9g]/)){


            error(name,"Number not Required");
        }
        else{

            success(name);
        }



        if(last_name.value==""){


            error(last_name,"last Name Required");
        }else if(last_name.value.length<3){

            error(last_name,"At Least 3 character Name");
        }else if(name.value.match(/[0-9g]/)){

            error(last_name,"Number not Required");
        }
        else {

            success(last_name);
        }

        if(password.value==""){

            error(password,"passwrod Required");
        }else if(password.value.length<5){

            error(password,"password must Grader the 5 Character");
        }else{

            success(password);
        }


        if(email.value==""){

            error(email,"Eamil is Required");
        }else if(email.value.length<10){

            error(email,"Emil character must Grader then 10 ");
        }else if(!name.value.include("@")&& name.value.include("gamil")){

            error(email,"@ and gamil Required");
        }
        else{

            success(email);
        }
       }
