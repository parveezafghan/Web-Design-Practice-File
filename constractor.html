 constructor(Enemy_healt,player_healt){

Game_Enemy(){

     console.log("Enemy healt="+this.Enemy_healt)
}

Game_playe_Demage(){

    }


}

Game_player_healt(){

    if(this.player_healt==100){

     console.log("Player health:"+this.player_healt);
}
