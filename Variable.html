    <style>
  :root{
    --main_color:pink;
    --item_color:yellow;
    --font_size:15px;
    --font_Family:roboto;
    --main_width:800px;
    --main_height:200px;
    --item-height:30px
  }

  .container{

    background:var(--main_color);
    width:var(--main_width);
    height: var(--main_height);

    display: flex;

    /* justify-content:space-evenly; */


    flex-wrap:wrap;

  
   

  
  }

  .item{

    background: var(--item_color);

    height:var(--item-height);

    flex-grow:1;

    

  }



 
  .item11{

    background-color: red;
    order:-1;

    flex-shrink:0;


    /* flex-grow:1; */
  }
  .item5{

    background-color: green;
    order:-2;
  }

  @keyframes color_aniamton{

   
    10%{

        background: red;
    }
    20%{

        background: green;
    }
    30%{

        background: yellow;
    }
    40%{

        background:orange;
    }

    50%{
        background: pink;
    }
    60%{

        background:gold;
    }
    100%{

        background: black;
    }
    10%{

        background:white;
    }
    

  }


  .item{


    animation:color_aniamton 2s infinite;
    
  }

 

  .show{

    background-color:red;
  }

  .card{

    width:200px;
    height:200px;
    background:pink;
    border-radius: 10px;

  }




      .con1{

         margin-left:200px;
         margin-right:200px;
         border: 1px solid red;
         background:pink;
      }
      h1{

        text-align: center;
      }

      button{

        border: none;
        border-radius:10px;
        background: yellowgreen;
        margin-left:200px;
      }

      .border{

        border:2px solid green;
        margin-top:10px;
        margin-bottom:10px;
        margin-left:50px;
        margin-right:50px;
        box-shadow: 2px 2px 2px 4px;

      }

     
#one :nth-child(3){

  background: greenyellow;
}


ul :first-child{

  background-color:red;
}

ul :last-child{

  background: greenyellow;
}

ul :nth-child(2){

  background:orange;
}
ul :nth-child(3){

  background:pink;
}
      

.li+li{

  background:black;
}


ul :first-child{
  background: palegreen;
}
.li~li{

  background:palegreen;
}

.W::after{

  content: "king of APP ";
  color:red;
}

.W::before{

  content: "starting ";
  color: green;
}

    </style>
