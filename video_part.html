<!DOCTYPE html>
<html>
<head>
  <title>FB Video Feed</title>
  <!-- <link rel="stylesheet" href="style.css"> -->

  <style>

    /* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

/* PAGE BACKGROUND */
body {
  background-color: #f0f2f5;
}

/* FEED CENTER */
.feed {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  margin-top: 25px;
}

/* POST CARD */
.post {
  width: 480px;
  background: #ffffff;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
  overflow: hidden;
}

/* VIDEO */
.post-video {
  width: 100%;
  height: 280px;
  object-fit: cover;
  display: block;
  background: #000;
}

/* ACTION BUTTONS */
.actions {
  display: flex;
  justify-content: space-around;
  padding: 10px;
  border-top: 1px solid #ddd;
}

.actions button {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 15px;
  color: #555;
  padding: 6px 12px;
  border-radius: 6px;
}

/* HOVER EFFECT */
.actions button:hover {
  background-color: #f0f2f5;
}

/* LIKE ACTIVE */
.like-btn.active {
  color: #1877f2;
  font-weight: bold;
}

/* COMMENT BOX */
.comment-box {
  display: none;
  padding: 10px;
  border-top: 1px solid #ddd;
  background-color: #fff;
}

/* COMMENT INPUT */
.comment-box input {
  width: 75%;
  padding: 8px 12px;
  border-radius: 20px;
  border: 1px solid #ccc;
  outline: none;
}

/* COMMENT POST BUTTON */
.comment-box button {
  padding: 7px 14px;
  margin-left: 6px;
  border-radius: 20px;
  border: none;
  background-color: #1877f2;
  color: #fff;
  cursor: pointer;
}

/* MOBILE RESPONSIVE */
@media (max-width: 520px) {
  .post {
    width: 95%;
  }

  .post-video {
    height: 220px;
  }
}

  </style>
</head>
<body>

<div class="feed">

  <!-- POST 1 -->
  <div class="post">
    <div><img src="/p.jpg.png" width="100%"></div>
    <video class="post-video" src="video1.mp4" controls></video>

    <div class="actions">
      <button class="like-btn">👍 Like</button>
      <button class="comment-btn">💬 Comment</button>
      <button>🔁 Share</button>
    </div>

    <div class="comment-box">
      <input type="text" placeholder="Write a comment...">
      <button>Post</button>
    </div>
  </div>

  <!-- POST 2 -->
  <div class="post">
    <video class="post-video" src="video2.mp4" controls></video>

    <div class="actions">
      <button class="like-btn">👍 Like</button>
      <button class="comment-btn">💬 Comment</button>
      <button>🔁 Share</button>
    </div>

    <div class="comment-box">
      <input type="text" placeholder="Write a comment...">
      <button>Post</button>
    </div>
  </div>

</div>

<!-- <script src="script.js"></script> -->



<script>
var likeButtons = document.getElementsByClassName("like-btn");
var commentButtons = document.getElementsByClassName("comment-btn");

/* LIKE BUTTON LOGIC */
for (var i = 0; i < likeButtons.length; i++) {
  likeButtons[i].onclick = function () {

    if (this.innerText == "👍 Like") {
      this.innerText = "👍 Liked";
      this.classList.add("active");
    } else {
      this.innerText = "👍 Like";
      this.classList.remove("active");
    }

  };
}

/* COMMENT BUTTON LOGIC */
for (var j = 0; j < commentButtons.length; j++) {
  commentButtons[j].onclick = function () {

    var post = this.parentElement.parentElement;
    var commentBox = post.getElementsByClassName("comment-box")[0];

    if (commentBox.style.display == "block") {
      commentBox.style.display = "none";
    } else {
      commentBox.style.display = "block";
    }

  };
}
</script>

</body>
</html>
